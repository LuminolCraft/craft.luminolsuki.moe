<!doctype html>
<html lang="en">
<head>
  <!-- Added document metadata; the stylesheet link is visible in the video. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smooth option switcher — canonical reconstruction</title>
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <!-- Observed component markup, recording approximately 43–52s.
       Formatting/comments normalized. The hidden inputs are intentional source
       fidelity, NOT the accessible production pattern; see production.md. -->
  <input type="radio" name="mode" id="free" checked hidden>
  <input type="radio" name="mode" id="premium" hidden>
  <input type="radio" name="version" id="monthly" checked hidden>
  <input type="radio" name="version" id="annual" hidden>

  <div class="btn-wrapper">
    <div class="main-content">
      <label for="free" class="free-wrapper">Free</label>
      <div class="premium-wrapper">
        <label for="premium" class="premium">Premium</label>
        <div class="version-menu">
          <label for="monthly" class="monthly">Monthly</label>
          <div class="dot">·</div>
          <label for="annual" class="annual">Annual</label>
          <div class="menu-slider"></div>
        </div>
      </div>
    </div>
    <div class="slider"></div>
  </div>
</body>
</html>
