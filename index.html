<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light">
    <title>LuminolCraft 服务器 - 加入我们的冒险</title>
    
    <!-- 关键字体预加载 - 提升首屏渲染速度 -->
    <link rel="preload" href="https://cdn-font.hyperos.mi.com/font/woff2/MiSans_VF.woff2" as="font" type="font/woff2-variations" crossorigin>
    <link rel="preconnect" href="https://cdn-font.hyperos.mi.com" crossorigin>
    
    <!-- Favicon 预加载 -->
    <link rel="icon" href="https://imagehosting-ez2.pages.dev/images/favicon.ico">
    <link rel="icon" href="https://imagehosting-ez2.pages.dev/images/favicon.png" type="image/png">
    
    <!-- 首屏 Hero 背景图预加载：与 JS 并行下载，避免 Home 挂载后才开始请求 -->
    <link rel="preload" as="image" href="/images/Image_1764466849.avif" fetchpriority="high">

    <!-- Font Awesome CDN (延迟加载，不阻塞首屏) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"></noscript>

    <!-- Umami 统计脚本由 src/main.ts 在生产构建下注入（dev 不打点，避免污染线上统计） -->

    <!--
      进站启动画面：JS 解析期间就有内容可看，避免白屏。
      Vue 应用挂载后由 PixelLoadingScreen 接管（同样式的像素格拼装 → 就绪后解体揭开），
      视觉必须与组件保持一致：#0b0e17 底 + 主题紫头像光晕 + LOADING 字样。
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0b0e17;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #boot__avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #a98cff, #6d4fe0 70%);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot__label {
        color: #b9aaff;
        font: 500 12px/16px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.3em;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgb(124 92 255 / 45%);
        }
        50% {
          box-shadow: 0 0 0 14px rgb(124 92 255 / 0%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot__avatar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="页面加载中">
      <div id="boot__inner">
        <img id="boot__avatar" src="/images/luminol-avatar-96.avif" alt="" width="56" height="56" />
        <span id="boot__label">LOADING</span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
