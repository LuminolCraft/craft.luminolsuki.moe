# 构建 ffmpeg wasm 核心（libaom-av1 编码器 + avif muxer）。
#
# 为什么在 CI 里编：产物约 25–40MB，需要 emsdk + cmake + Docker 从源码编 libaom 与
# FFmpeg（详见 scripts/ffmpeg-core/Dockerfile）。开发机不必具备工具链；编一次传到
# Release，之后 scripts/fetch-ffmpeg-core.mjs 在构建期按 URL 拉取并校验 sha256。
#
# 触发：
# - 手动（Actions → build-ffmpeg-core → Run workflow），产物为 artifact；
# - 打 tag `ffmpeg-core-v*`，额外把两个文件挂到同名 Release，供构建期直接下载。
#
# 注意：核心是单线程构建（FFMPEG_ST=1），因此**不需要** COOP/COEP 响应头。
name: build-ffmpeg-core

on:
  workflow_dispatch:
  push:
    tags:
      - 'ffmpeg-core-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 编 libaom + FFmpeg 是重活：冷缓存约 30–50 分钟
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show docker version
        run: |
          docker version --format '{{.Server.Version}}'
          docker buildx version

      # 构建脚本与 CI 完全同源：本地 `bash scripts/build-ffmpeg-core.sh` 跑的是同一条命令
      - name: Build ffmpeg core (libaom + avif muxer)
        run: bash scripts/build-ffmpeg-core.sh

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -lh public/ffmpeg/
          test -s public/ffmpeg/ffmpeg-core.js
          test -s public/ffmpeg/ffmpeg-core.wasm
          # 核心必须真的包含 avif muxer 与 libaom 编码器，否则会「编译成功但不可用」
          grep -qa 'libaom-av1' public/ffmpeg/ffmpeg-core.wasm
          # avif muxer 的符号名就藏在 wasm 字符串表里，缺了前端 AVIF 输出必失败
          grep -qa 'avif' public/ffmpeg/ffmpeg-core.wasm
          echo "含 libaom-av1 编码器与 avif muxer ✅"

      - name: Compute checksums
        id: checksums
        run: |
          set -euo pipefail
          cd public/ffmpeg
          JS_SHA=$(sha256sum ffmpeg-core.js | cut -d' ' -f1)
          WASM_SHA=$(sha256sum ffmpeg-core.wasm | cut -d' ' -f1)
          echo "js=${JS_SHA}" >> "$GITHUB_OUTPUT"
          echo "wasm=${WASM_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "ffmpeg-core.js   sha256=${JS_SHA}"
            echo "ffmpeg-core.wasm sha256=${WASM_SHA}"
          } | tee checksums.txt

      - name: Job summary
        run: |
          {
            echo "## ffmpeg core 构建完成"
            echo
            echo "| 文件 | 大小 | sha256 |"
            echo "|---|---|---|"
            echo "| \`ffmpeg-core.js\` | $(du -h public/ffmpeg/ffmpeg-core.js | cut -f1) | \`${{ steps.checksums.outputs.js }}\` |"
            echo "| \`ffmpeg-core.wasm\` | $(du -h public/ffmpeg/ffmpeg-core.wasm | cut -f1) | \`${{ steps.checksums.outputs.wasm }}\` |"
            echo
            echo "### 用法 A：配 Netlify 环境变量（构建期自动下载）"
            echo '```'
            echo "FFMPEG_CORE_URL=<直链>/ffmpeg-core.js"
            echo "FFMPEG_CORE_WASM_URL=<直链>/ffmpeg-core.wasm"
            echo "FFMPEG_CORE_SHA256=${{ steps.checksums.outputs.js }}"
            echo "FFMPEG_CORE_WASM_SHA256=${{ steps.checksums.outputs.wasm }}"
            echo "FFMPEG_CORE_STRICT=1"
            echo '```'
            echo
            echo "### 用法 B：直接下 artifact，把两个文件放进 public/ffmpeg/"
            echo "artifact 名：\`ffmpeg-core-${{ github.run_id }}\`（页面底部 Artifacts 区）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core-${{ github.run_id }}
          path: |
            public/ffmpeg/ffmpeg-core.js
            public/ffmpeg/ffmpeg-core.wasm
            public/ffmpeg/checksums.txt
          retention-days: 30
          # 两个文件合计 25–40MB，压缩收益不大，但保持默认 zip 便于一次下载
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/ffmpeg-core-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/ffmpeg/ffmpeg-core.js
            public/ffmpeg/ffmpeg-core.wasm
            public/ffmpeg/checksums.txt
          name: ffmpeg core ${{ github.ref_name }}
          body: |
            FFmpeg ${{ env.FFMPEG_VERSION || 'n5.1.4' }} + libaom（AVIF muxer，单线程）。
            sha256 见 checksums.txt；用法见 scripts/fetch-ffmpeg-core.mjs。
          fail_on_unmatched_files: true
