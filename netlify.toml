[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # 前端 API 基地址（Vite 构建时静态注入）。随仓库提交，Netlify 无需后台手动配置；
  # 代码侧另有按构建模式的回退默认值（src/lib/api-base.ts），此变量用于显式覆盖
  VITE_API_BASE_URL = "https://luminol-nexus.narcssu.top"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
