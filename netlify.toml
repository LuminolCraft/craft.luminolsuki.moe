[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # 钉 pnpm 版本与本地一致：pnpm-workspace.yaml 里的 patchedDependencies（v-calendar 补丁）
  # 与 allowBuilds 需要 pnpm 10+（11 起才从 workspace 读补丁配置），旧版会在
  # Install dependencies 阶段报非零退出
  PNPM_VERSION = "12.8.1"
  # API 基地址留空 = 同源：浏览器只与 craft.luminolsuki.moe 通信，
  # /api/* 由下方 redirects 同源反代到 Worker（Cookie 第一方，规避跨站分区）
  VITE_API_BASE_URL = ""

# 缓存策略。注意：Netlify 的 headers `for` 只支持结尾通配（`/*`、`/dir/*`），
# 之前写的 `/*.css` / `/*.js` 一条都不生效，等于所有资源走默认策略——HTML 和
# SPA 深链被 Netlify Edge 缓存成 ttl≈1 年（响应头实证 cache-status: hit;
# ttl=31535987）。发布后深链仍返回旧 HTML，引用的旧 hash 资源已被新部署顶掉，
# 页面就停在加载画面。故：先全局 no-cache 兜底，再给带哈希的产物覆盖长缓存。
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# API 同源反代（必须位于 /* SPA 兜底之前：redirects 按顺序首个匹配生效）：
# /api/*（业务 API + Better Auth）转发到 Cloudflare Worker。force = true 确保优先
# 于静态文件；status = 200 为代理模式（透传请求/响应与 Set-Cookie，浏览器视角
# 全程同源，会话与 OAuth state Cookie 均为第一方）
[[redirects]]
  from = "/api/*"
  to = "https://luminolcraft-nexus.narcssu.top/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
